# Contributor names and emails have been removed. Each contributor is
# identified only by their hashed ID (contributor_id).
#
# Initial seed list. Review and curate before authoritative evaluation runs.
#
# Top 5 contributors by commit count from each repo (php-src, event-stream,
# systemd). Selection excludes all known malicious commit authors.
#
# appropriate_for_threat_models: tags which threat models each negative
# scenario is valid for testing. Negatives are tagged with which threat
# models they are appropriate for testing. A sparse contributor cannot
# test impersonation detection because there is no baseline to measure
# against, but is the right shape for testing cold-start detection.
#
# - Rich-history contributors (50+ commits, 6+ months): impersonation,
#   patient_attacker — they have deep baselines a detector can compare
#   against.
# - Sparse contributors (few commits, short tenure): cold_start — they
#   look like the shape of a cold-start attacker but are benign.
# - Bots: cold_start — same logic, unusual commit pattern but benign.

